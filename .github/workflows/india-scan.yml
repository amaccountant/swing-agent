name: India Scan
on:
  schedule:
    - cron: '50 3 * * 1-5'
    - cron: '50 2 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance
      - name: Refresh India watchlist (intelligent)
        run: python refresh_watchlist_in.py
      - name: India scan
        run: python scan_in.py
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit results
        run: |
          git config user.name "swing-agent"
          git config user.email "bot@users.noreply.github.com"
          git add index.html picks_today_in.json watchlist_in.csv
          git commit -m "India morning picks" || echo "nothing to commit"
          git push
