name: Evening Review
on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance
      - name: Paper tracker and calibration audit
        run: python track_review.py
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit results
        run: |
          git config user.name "swing-agent"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Evening calibration audit" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
