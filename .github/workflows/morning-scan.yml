- name: Refresh watchlist (intelligent)
        run: python refresh_watchlist.py
- name: Morning Scan
on:
  schedule:
    - cron: '0 7 * * 1-5'    # 08:00 CET (winter, UTC+1), Mon-Fri
    - cron: '0 6 * * 1-5'    # 08:00 CEST (summer, UTC+2), Mon-Fri
  workflow_dispatch:          # also allows manual run anytime
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance
      - name: Morning scan
        run: python scan.py
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit results
        run: |
          git config user.name "swing-agent"
          git config user.email "bot@users.noreply.github.com"
          git add index.html picks_today.json watchlist.csv
          git commit -m "Morning picks + dashboard" || echo "nothing to commit"
          git push
